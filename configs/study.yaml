# User study (G2): which scans, how they are shown, time limit, balancing.
# The scans come from the model output of another config (source_config), so the study uses exactly
# the masks and heatmaps that G1 evaluated.
#
# Prepare once:  uv run python scripts/prepare_study.py --config configs/study.yaml
# Start:         uv run python scripts/run_ui.py --config configs/study.yaml

name: study_kits
source_config: configs/kits100.yaml   # model output, ground truth and scores are taken from here
seed: 42

paths:
  study_dir: data/study               # prepared scans, saved masks and logs (not in git)

selection:                            # which KiTS scans are suitable for the study (ground truth is used here,
  dice_min: 0.70                      # only to pick scans; the participants never see it)
  dice_max: 0.90                      # visible errors, but not an empty or nearly empty mask
  error_ml_min: 50                    # total wrong volume (missed + extra) in ml: big enough to see ...
  error_ml_max: 400                   # ... small enough to fix within the time limit
  max_axial_slices: 150               # many thin slices make a fix too slow with a 2D brush
  require_both_sides: true            # skip scans where a whole kidney is missing (plausibility check)
  n_scans: 6                          # scans per participant: 3 with heatmap, 3 without (see balancing)
  n_practice: 1                       # extra scan for a practice round (not part of the analysis)
  crop_margin_mm: 40                  # the CT is cut to the slices with predicted kidney plus this margin
  min_gt_in_crop: 0.99                # preparation stops if a crop would cut away more ground truth than this

study:
  heatmap: entropy                    # LOCKED on the development set (results/kits100/heatmap_eval_dev_summary.csv)
  time_limit_min: 5                   # per scan (study and practice); the scan is locked and saved when the time is up.
                                      # The demo queue has no time limit.
  participant_prefix: P               # participant ids look like P01, P02, ...; the number sets the balancing group
  test_prefix: T                      # test runs use T01, T02, ... (same balancing, never analyzed, and
                                      # scripts/clean_test_data.py deletes them; it never touches P ids)
  tlx: after_each_block               # NASA-TLX (Raw TLX, 6 scales) in the interface: after_each_block (after each
                                      # condition, so workload WITH vs WITHOUT the heatmap can be compared per
                                      # participant) or after_session (once, at the end)

queue:                                # demo mode: scans ranked by the G1 score, heatmap always available
  n_scans: 10                         # the n test scans with the highest score
  score: model_diff_mean_region       # LOCKED primary G1 measure

guide:                                # example image on the instruction screen before the practice scan
  labels: {kidney: 1, tumor: 2, cyst: 3}    # ground-truth label values of the dataset (KiTS23)
  min_piece_cm2: 3                    # the slice must show at least two separate pieces of kidney this big
  margin_mm: 60                       # space around the kidneys in the image
  colors: {kidney: "#3ddc84", tumor: "#ffc233", cyst: "#ff6bd6"}

viewer:
  window_presets:                     # contrast buttons (Hounsfield units); the first one is used at start
    - {name: Normal, level: 40, width: 400}
    - {name: High contrast, level: 60, width: 200}
  heatmap_colormap: blue2cyan         # cold colors, so the heatmap is easy to tell apart from the red mask
  heatmap_min: 0.1                    # entropy below this (bits) is not drawn, so only uncertain voxels show
  heatmap_opacity: 0.6
  mask_color: [235, 40, 40]           # red; the mask is always drawn on top of the heatmap
  mask_opacity: 0.45                  # fill of the mask
  mask_outline_px: 2                  # solid outline along the mask's edge (screen pixels), so it stays visible
                                      # on top of the heatmap; 0 = no outline
  compare_colors:                     # ground-truth comparison (practice answer, demo queue)
    correct: [235, 40, 40]            # marked and kidney (same red as the mask)
    missed: [255, 205, 0]             # kidney that is not marked
    extra: [60, 130, 255]             # marked, but not kidney
  pen_sizes: [1, 3, 7, 11]            # brush diameters in voxels (odd, so the round brush is centered on a voxel)
  default_pen_size: 7
  zoom_min: 1                         # 1 = the whole slice fits the window
  zoom_max: 8
  pinch_zoom_speed: 0.01              # trackpad pinch (and Ctrl + scroll): zoom factor per scroll pixel (exp scale)
  two_finger_scroll: pan              # what a two-finger swipe on the trackpad does: pan (move the image),
                                      # slice (change slice) or zoom
  scroll_px_per_slice: 40             # only for two_finger_scroll: slice
  slice_marks_fraction: 0.5           # "with heatmap": slices whose uncertainty (sum of shown heatmap values) is at
                                      # least this fraction of the most uncertain slice are marked on the slider

power:                                # planning: participants needed for an assumed effect (scripts/power_study.py)
  effect_sizes_dz: [0, 0.5, 0.8, 1.0, 1.2]   # d_z = mean / SD of the per-participant differences (with - without);
                                      # 0 checks the false-positive rate
  n_participants: [4, 8, 12, 16, 20, 24, 28, 32, 36, 40]   # multiples of 4 (balancing)
  n_simulations: 10000
  alpha: 0.05                         # two-sided Wilcoxon signed-rank test, as in the analysis
  target_power: 0.8

server:
  host: 127.0.0.1
  port: 8765
  browser: chrome                     # what scripts/run_ui.py opens: chrome (the study only runs in Chrome),
                                      # default (the computer's default browser) or none

# KiTS23, 100 randomly chosen scans (fixed seed), laptop settings (3 mm + 6 mm model, no TTA).
# Split: the 20 pilot scans are the DEVELOPMENT set (all choices are made on them), the other 80 are the
# TEST set (evaluated once, after every choice was locked on the development set). The final G1 result is the test set.
# Every setting that changes runtime or data lives here, so scripts never hardcode paths or numbers.
# Use it with:  uv run python scripts/<script>.py --config configs/kits100.yaml

name: kits100           # output goes to results/kits100/ and data/predictions/kits100/
seed: 42

compute:
  device: auto        # auto = CUDA if available, else MPS (Apple Silicon), else CPU. Or force: cuda / mps / cpu
  num_threads: 0      # CPU threads for torch. 0 = use all cores
  reduce_chunk_slices: 16  # slices processed at a time when reducing the 117-class output (lower = less memory)

paths:                # relative paths are relative to the repository root
  raw_dir: data/raw                 # downloaded datasets
  models_dir: models                # pretrained weights
  predictions_dir: data/predictions # model output per scan (masks, probability maps). Not in git
  results_dir: results              # small result files (csv, figures). In git

dataset:
  file: configs/datasets/kits23.yaml  # which dataset (paths, labels, matching TotalSegmentator classes)
  n_cases: 100        # how many scans to use. null = all
  selection: random   # first = first n in sorted order; random = n drawn with the seed from the full list
  # Development / test split. dev = the 20 scans of the pilot (the first 20 of the same seeded draw);
  # test = every other selected scan (80). Listed explicitly so the split can never shift.
  split:
    dev: [case_00040, case_00051, case_00135, case_00178, case_00236, case_00249, case_00261, case_00271,
          case_00291, case_00295, case_00298, case_00456, case_00465, case_00467, case_00528, case_00544,
          case_00559, case_00563, case_00574, case_00582]

model:
  task: total         # TotalSegmentator task (v2 "total": 117 structures)
  resolution: fast    # fast = 3 mm model (one network), full = 1.5 mm model (the organ part)
  folds: [0]          # nnU-Net folds to use. The public TotalSegmentator weights only contain fold 0
  tile_step_size: 0.8 # overlap between sliding-window patches (0.5 = more overlap, slower, nnU-Net default)

uncertainty:
  border_mm: 5        # the uncertainty region is the predicted organ plus this many mm around it
  second_model_resolution: fastest  # second network for model disagreement: fastest = 6 mm (task 298). null = off
  tta:                # test-time augmentation: run the network again on slightly changed copies of the scan
    n_passes: 0       # number of extra passes per scan. 0 = no TTA
    max_shift_voxels: 2       # random shift of the scan by up to this many voxels (at the network's resolution)
    intensity_scale: 0.05     # random intensity scaling by up to +-5 %
    intensity_shift_hu: 20    # random intensity offset by up to +-20 Hounsfield units
    noise_std_hu: 10          # Gaussian noise with this standard deviation (HU)

heatmap_eval:         # G2: which heatmap points best at the wrong voxels (scripts/evaluate_heatmaps.py)
  candidates: [entropy, m2_diff]   # entropy = binary entropy of the organ probability; m2_diff = |p_3mm - p_6mm|
  top_fraction: 0.1   # share of the region's voxels with the highest heatmap values ("top 10 %")

plausibility:        # anatomical check for paired organs (only if the dataset file sets paired_organ: true)
  body_threshold_hu: -500   # voxels above this CT value count as body when finding the left-right midline
  min_component_ml: 20      # a side counts as "organ found" if its largest connected piece is at least this big

# Controlled perturbations: degraded copies of each scan, to create segmentation errors on purpose.
# Results on these are reported separately from the clean scans.
perturbations: []   # none here; see local.yaml
perturbation_settings:
  contrast_level_hu: 40     # gray value that stays fixed when contrast is reduced (soft tissue)

evaluation:
  splits: [dev, test] # splits whose ground truth may be used. 'test' was added 24/9 after the choices were locked (01:43)
  bad_rules:          # which segmentations count as "bad" in the review curve; every rule is reported
    - {name: worst10, rule: worst_fraction, value: 0.1}      # the worst 10 % of the scans
    - {name: dice_below_083, rule: threshold, value: 0.83}   # fixed Dice limit, chosen on the development set
  n_bootstrap: 2000   # resamples for the confidence interval of Spearman rho and the curve areas
  ci_level: 0.95
  n_random_orders: 1000  # random review orders averaged for the random baseline
  combinations:       # GT-free scores merged by rank. LOCKED on the development set:
    # mean rank of the best dev uncertainty measure and the missing-side plausibility flag.
    - {name: combo_mean_missing, rule: mean_rank, scores: [model_diff_mean_region, plaus_missing_side]}

visualization:
  ct_window_level: 40   # soft-tissue CT window in Hounsfield units (center)
  ct_window_width: 400  # (width)
  dice_bin_width: 0.01  # histogram bin width in the Dice plots
  share_bin_width: 0.05 # histogram bin width for shares (0-1) in the label check plot
  label_worst_n: 3      # how many of the worst scans get their name written in plots
  dpi: 120

report:                         # figures and tables for the paper (scripts/make_report_figures.py); no new analysis
  set: clean_test               # the final G1 result is the test set
  primary: model_diff_mean_region   # LOCKED primary measure (used to pick the heatmap example scans)
  heatmap: entropy              # LOCKED G2 heatmap
  example_bad_rule: worst10     # "bad" rule used to pick the failure examples

# EXPLORATORY follow-up analyses (meeting with the supervisor, 2026-10-07). Run AFTER the G1 choices were locked,
# so nothing here may change the locked G1 result. They only read saved predictions (no new inference) and report
# the dev and test sets separately. Scripts: scripts/compare_models.py, scripts/simulate_voxel_correction.py.
exploratory:
  model_comparison:             # how good is the 6 mm model alone, and where do the 3 mm and 6 mm masks differ?
    bad_rule: dice_below_083    # name of the evaluation.bad_rules entry whose threshold marks a "bad" scan
    queue_top_n: 20             # rows in the table of the top of the locked queue (report.primary)
    grid_band_mm: 6             # disagreement within this distance of the 3 mm mask's edge counts as the grid
                                # effect (about one 6 mm voxel); farther away = a real difference in shape or content
    distance_bins_mm: [3, 6, 12]  # finer distance bins for the breakdown (must contain grid_band_mm)
  voxel_correction:             # simulated correction inside a scan: fix the k % most uncertain region voxels
    k_percent: [1, 2, 5, 10, 20, 50]   # share of the region's voxels corrected to ground truth
    methods: [entropy, m2_diff, boundary, random, oracle]   # voxel orders compared (see voxel_correction.py)
    random_seeds: [42, 43, 44, 45, 46] # the random order is averaged over these seeds
    auc_up_to_percent: [10, 50]        # area under the gain-vs-k curve from 0 up to these k (in %)
  disagreement_scores:          # 2026-10-20: GT-free scan scores built from only PART of the 3 mm vs. 6 mm disagreement
    # Written down BEFORE any of these scores was computed or evaluated. kits100 is used as development data for this
    # new question (dev and test reported separately); a score chosen here must later be tested ONCE on the G3 pool.
    # "Far" = more than exploratory.model_comparison.grid_band_mm (6 mm) from the 3 mm mask's edge (the grid effect
    # is left out). Script: scripts/explore_disagreement_scores.py.
    candidates:                 # which disagreeing voxels are counted
      - far_disagree            # masks disagree and far from the 3 mm edge (both directions)
      - far_6mm_adds            # as far_disagree, but only where 6 mm = organ and 3 mm = not organ
      - far_6mm_drops           # as far_disagree, but only where 6 mm = not organ and 3 mm = organ (control, expected poor)
      - 6mm_adds_all            # 6 mm = organ and 3 mm = not organ, no distance filter
    normalizations: [ml, per_volume]   # ml = volume of those voxels; per_volume = their number / 3 mm mask voxels
    selection:                  # how ONE score is chosen among the 4 x 2 candidates (on dev only)
      split: dev
      bad_rule: dice_below_083
      metric: review_auc        # highest wins; ties: higher quality_auc on dev, then the order listed above (ml first)
    compare_to: [model_diff_mean_region, entropy_mean_region]   # paired bootstrap CI of the AUC / rho difference
    queue_top_n: [10, 20]       # real finds and false alarms in the top of each score's queue
    figure: {split: test, bad_rule: dice_below_083}   # review curves of the new scores vs. locked measure and baselines

# G3 smoke test on an NVIDIA GPU, 3 mm model: a copy of configs/g3_smoke_gpu.yaml (see there) with the 3 mm model
# (task 297, patch 112 x 112 x 128) at its own batch size 2. The 3 mm model is the one G3 fine-tunes in the main
# experiment (docs/g3_plan.md); its mask is what G1 ranks and G2 shows.
#
# Run (from the repository root, on Windows):
#   .venv\Scripts\python.exe scripts\g3_smoke_test.py --config configs\g3_smoke_gpu_3mm.yaml

name: g3_smoke_gpu_3mm                # results go to results/g3_smoke_gpu_3mm/
source_config: configs/kits100.yaml   # dataset paths, model weights and seed. Its 100 scans are NEVER used here
seed: 42

model_resolution: fast                # fast = the 3 mm model (task 297)
cases: [case_00183, case_00002]       # positions 101 and 102 of kits100's seeded draw, as in g3_smoke_gpu.yaml
truth_to_classes:
  kidney: [1, 2]
  kidney_cyst: [3]
body_threshold_hu: -500

work_dir: data/g3_smoke_gpu_3mm       # nnU-Net folders for this test. Not in git

compute:
  device: cuda                        # forced: stop instead of silently measuring the CPU
  num_threads: 1                      # as nnU-Net's own training start on a GPU (see g3_smoke_gpu.yaml)
  augmentation_processes: [0, 16]     # 0 = time to prepare one batch; 16 = workers as in a real run

training:
  batch_sizes: [2]                    # the 3 mm model's own batch size (plans)
  iterations: 30
  warmup_iterations: 10
  validation_iterations: 10
  initial_lr: 0.001

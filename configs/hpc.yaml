# HPC configuration: DTU HPC (Linux with an NVIDIA GPU).
# Same structure as local.yaml, but full resolution, all scans, TTA and more perturbation strengths.
# Not tested yet (no GPU access so far).
# Every setting that changes runtime or data lives here, so scripts never hardcode paths or numbers.
# Use it with:  uv run python scripts/<script>.py --config configs/hpc.yaml

name: hpc             # output goes to results/hpc/ and data/predictions/hpc/
seed: 42

compute:
  device: auto        # auto = CUDA if available, else MPS (Apple Silicon), else CPU. Or force: cuda / mps / cpu
  num_threads: 0      # CPU threads for torch. 0 = use all cores
  reduce_chunk_slices: 16  # slices processed at a time when reducing the 117-class output (lower = less memory)

paths:                # relative paths are relative to the repository root
  raw_dir: data/raw                 # tip: point these at scratch storage (e.g. /work3/<user>/...) on the HPC
  models_dir: models                # pretrained weights
  predictions_dir: data/predictions # model output per scan (masks, probability maps). Not in git
  results_dir: results              # small result files (csv, figures). In git

dataset:
  file: configs/datasets/msd_spleen.yaml  # which dataset (paths, labels, matching TotalSegmentator class)
  n_cases: null       # how many scans to use (first n in sorted order). null = all

model:
  task: total         # TotalSegmentator task (v2 "total": 117 structures)
  resolution: full    # fast = 3 mm model (one network), full = 1.5 mm model (the organ part)
  folds: [0]          # nnU-Net folds to use. The public TotalSegmentator weights only contain fold 0
  tile_step_size: 0.5 # overlap between sliding-window patches (0.5 = more overlap, slower, nnU-Net default)

uncertainty:
  border_mm: 5        # the uncertainty region is the predicted organ plus this many mm around it
  tta:                # test-time augmentation: run the network again on slightly changed copies of the scan
    n_passes: 8       # number of extra passes per scan. 0 = no TTA
    max_shift_voxels: 2       # random shift of the scan by up to this many voxels (at the network's resolution)
    intensity_scale: 0.05     # random intensity scaling by up to +-5 %
    intensity_shift_hu: 20    # random intensity offset by up to +-20 Hounsfield units
    noise_std_hu: 10          # Gaussian noise with this standard deviation (HU)

# Controlled perturbations: degraded copies of each scan, to create segmentation errors on purpose.
# Results on these are reported separately from the clean scans.
perturbations:
  - {name: noise_30, type: noise, strength: 30}          # Gaussian noise, standard deviation in HU
  - {name: noise_60, type: noise, strength: 60}
  - {name: noise_100, type: noise, strength: 100}
  - {name: contrast_40, type: contrast, strength: 0.4}   # remove 40 % of the contrast around contrast_level_hu
  - {name: contrast_60, type: contrast, strength: 0.6}
  - {name: contrast_80, type: contrast, strength: 0.8}
  - {name: lowres_5mm, type: lowres, strength: 5}        # blur by down- and upsampling to 5 mm voxels
  - {name: lowres_8mm, type: lowres, strength: 8}
  - {name: lowres_12mm, type: lowres, strength: 12}
perturbation_settings:
  contrast_level_hu: 40     # grey value that stays fixed when contrast is reduced (soft tissue)

evaluation:
  bad:                # which segmentations count as "bad" in the review curve
    rule: worst_fraction  # worst_fraction = the worst X of the scans; threshold = Dice below X
    value: 0.1            # the worst 10 % of the scans
  n_bootstrap: 2000   # resamples for the confidence interval of Spearman rho and the curve areas
  ci_level: 0.95
  n_random_orders: 1000  # random review orders averaged for the random baseline

visualisation:
  ct_window_level: 40   # soft-tissue CT window in Hounsfield units (centre)
  ct_window_width: 400  # (width)
  dice_bin_width: 0.01  # histogram bin width in the Dice plot
  label_worst_n: 3      # how many of the worst scans get their name written in plots
  dpi: 150

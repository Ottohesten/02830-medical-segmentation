# HPC configuration: DTU HPC (Linux with an NVIDIA GPU).
# Same structure as local.yaml, but full resolution and all scans.
# Use it with:  uv run python scripts/<script>.py --config configs/hpc.yaml

name: hpc             # used in result filenames, so local and HPC results never overwrite each other
seed: 42

compute:
  device: auto        # auto = CUDA if available, else MPS (Apple Silicon), else CPU. Or force: cuda / mps / cpu
  num_threads: 0      # CPU threads for torch. 0 = use all cores
  reduce_chunk_slices: 16  # slices processed at a time when reducing the 117-class output (lower = less memory)

paths:                # relative paths are relative to the repository root
  raw_dir: data/raw                 # tip: point these at scratch storage (e.g. /work3/<user>/...) on the HPC
  models_dir: models
  predictions_dir: data/predictions
  results_dir: results

dataset:
  name: msd_spleen
  url: https://msd-for-monai.s3-us-west-2.amazonaws.com/Task09_Spleen.tar
  gt_label: 1
  n_cases: null       # null = all 41 scans

model:
  task: total
  resolution: full    # 1.5 mm model
  organ: spleen
  folds: [0]          # The public TotalSegmentator weights only contain fold 0
  tile_step_size: 0.5 # nnU-Net default overlap

uncertainty:
  n_tta: 8            # number of test-time augmentation passes (used from phase 2)

visualisation:
  ct_window_level: 40   # soft-tissue CT window in Hounsfield units (centre)
  ct_window_width: 400  # (width)
  dpi: 150

# Step 3: exploratory GT-free checks from saved kits100 masks and score tables.
# Separate from the completed inspection config/results; no inference or combinations.
name: kits_missed_checks
seed: 42
compute: {device: cpu, num_threads: 6}
paths:
  raw_dir: data/raw
  models_dir: models
  predictions_dir: data/predictions
  results_dir: results
dataset: {file: configs/datasets/kits23.yaml, n_cases: 100, selection: random}

checks:
  source_config: configs/kits100.yaml
  inspection_queue: results/kits_missed_errors/exploratory_queue.csv
  variant: clean
  primary: model_diff_mean_region
  review_fraction: 0.20
  bad_dice_threshold: 0.83
  # Use the two largest sufficiently large connected components as kidney proxies.
  # Threshold matches the existing plausibility check; no GT-based component selection.
  min_component_ml: 20
  max_components: 2
  connectivity: 1  # six-neighbor connectivity, as in the shared plausibility check
  pred_volume_rtol: 0.00001
  pred_volume_atol_ml: 0.001
  methods:
    - model_diff_mean_region
    - entropy_mean_region
    - neg_volume_ml
    - plaus_missing_side
    - plaus_asymmetry
    - size_min_side_neg_ml
    - shape_hull_deficit_max
    - shape_compactness_deficit_max
    - far_disagree_per_volume
    - far_6mm_adds_per_volume
  references: [model_diff_mean_region]
  benchmark: {n_cases: 3, n_bootstrap: 50, safety_factor: 2, max_stage_seconds: 1800}

evaluation:
  bad_rules:
    - {name: dice_below_083, rule: threshold, value: 0.83}
    - {name: worst10, rule: worst_fraction, value: 0.1}
  n_bootstrap: 2000
  ci_level: 0.95
  n_random_orders: 1000
